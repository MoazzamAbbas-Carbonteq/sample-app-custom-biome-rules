name: CI Pipeline

on:
  push:
    branches: [main, develop, development]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------- FORMAT CHECK ----------------
      - name: Check formatting
        id: format-check
        continue-on-error: true
        run: |
          echo "::add-matcher::.github/workflows/biome-problem-matcher.json"
          if ! pnpm biome format; then
            echo "has_formatting_issues=true" >> $GITHUB_OUTPUT
            echo "::error::Code formatting issues detected"
          else
            echo "has_formatting_issues=false" >> $GITHUB_OUTPUT
          fi

      # ---------------- LINT CHECK ----------------
      - name: Run linter
        id: lint-check
        continue-on-error: true
        run: |
          echo "::add-matcher::.github/workflows/biome-problem-matcher.json"
          if ! pnpm biome lint; then
            echo "has_linting_issues=true" >> $GITHUB_OUTPUT
            echo "::error::Linting issues detected"
          else
            echo "has_linting_issues=false" >> $GITHUB_OUTPUT
          fi

      # ---------------- BUILD ----------------
      - name: Build project
        id: build-check
        continue-on-error: true
        run: pnpm build

      # ---------------- PR COMMENT ----------------
      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const hasFormatIssues = '${{ steps.format-check.outputs.has_formatting_issues }}' === 'true';
            const hasLintIssues = '${{ steps.lint-check.outputs.has_linting_issues }}' === 'true';
            const hasBuildIssues = '${{ steps.build-check.outcome }}' === 'failure';

            let body = '## 📋 CI Results\n\n';

            body += hasFormatIssues
              ? '❌ **Formatting Issues**: Run `pnpm biome format --write`\n\n'
              : '✅ **Formatting**: OK\n\n';

            body += hasLintIssues
              ? '❌ **Linting Issues**: Fix lint errors\n\n'
              : '✅ **Linting**: OK\n\n';

            body += hasBuildIssues
              ? '❌ **Build**: Failed\n\n'
              : '✅ **Build**: Successful\n\n';

            body += '---\n\n';
            body += hasFormatIssues || hasLintIssues || hasBuildIssues
              ? 'Please fix the issues above before merging.'
              : '🎉 All checks passed!';

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## 📋 CI Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      # ---------------- FINAL FAIL ----------------
      - name: Fail on issues
        if: |
          steps.format-check.outputs.has_formatting_issues == 'true' ||
          steps.lint-check.outputs.has_linting_issues == 'true' ||
          steps.build-check.outcome == 'failure'
        run: exit 1
