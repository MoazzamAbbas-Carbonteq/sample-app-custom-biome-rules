name: reviewdog
on: [pull_request]

jobs:
  biome:
    name: runner / Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
      
      - name: Install Biome
        run: npm install -g @biomejs/biome
      
      - name: Run Biome with reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      
      - name: Run reviewdog
        run: |
          biome check --reporter=rdjson . | reviewdog -f=rdjson -reporter=github-pr-review -filter-mode=nofilter -level=error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.github_token }}
    