name: reviewdog

on: [pull_request]

jobs:
  biome:
    name: runner / Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      - name: Run Biome with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.github_token }}
        run: |
          set -eo pipefail
          # Run biome and capture output
          pnpm biome lint --reporter=json > biome-output.json || true
          
          # Check if output file exists and has content
          if [ -s biome-output.json ]; then
            # Process the JSON output and feed to reviewdog
            node -e "
              const fs = require('fs');
              try {
                const biomeOutput = JSON.parse(fs.readFileSync('biome-output.json', 'utf8'));
                if (biomeOutput.diagnostics && biomeOutput.diagnostics.length > 0) {
                  biomeOutput.diagnostics.forEach(diag => {
                    // Handle possible undefined values
                    const line = (diag.location && diag.location.span && diag.location.span[0] !== undefined) ? diag.location.span[0] : 1;
                    const column = (diag.location && diag.location.span && diag.location.span[1] !== undefined) ? diag.location.span[1] : 1;
                    const filePath = (diag.location && diag.location.path && diag.location.path.file) ? diag.location.path.file : 'unknown';
                    const message = (diag.message && diag.message[0] && diag.message[0].content) ? diag.message[0].content : 'Unknown error';
                    const output = \`\${filePath}:\${line}:\${column}: \${message}\`;
                    console.log(output);
                  });
                } else {
                  process.exit(0); // No diagnostics found
                }
              } catch (e) {
                console.error('Error parsing biome output:', e);
                process.exit(1);
              }
            " | reviewdog -efm="%f:%l:%c: %m" -reporter=github-pr-review -name="biome" || true
          else
            echo "No linting issues found"
          fi