name: reviewdog
on:
  push:
    branches: [main, development]
  pull_request:
jobs:
  shellcheck:
    name: runner / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: haya14busa/action-cond@94f77f7a80cd666cb3155084e428254fea4281fd # v1.2.1
        id: reporter
        with:
          cond: ${{ github.event_name == 'pull_request' }}
          if_true: "github-pr-review"
          if_false: "github-check"
      - uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1.32.0
        with:
          reporter: ${{ steps.reporter.outputs.value }}
          level: warning
          exclude: "./test/*"

  shfmt:
    name: runner / shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: reviewdog/action-shfmt@d8f080930b9be5847b4f97e9f4122b81a82aaeac # v1.0.4

  actionlint:
    name: runner / actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: reviewdog/action-actionlint@83e4ed25b168066ad8f62f5afbb29ebd8641d982 # v1.69.1
        with:
          reporter: github-check
          level: warning

  misspell:
    name: runner / misspell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: reviewdog/action-misspell@d6429416b12b09b4e2768307d53bef58d172e962 # v1.27.0
        with:
          reporter: github-check
          level: warning
          locale: "US"

  alex:
    name: runner / alex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: reviewdog/action-alex@6083b8ca333981fa617c6828c5d8fb21b13d916b # v1.16.0
        with:
          reporter: github-check
          level: warning

  biome:
    name: runner / biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run Biome linter with reviewdog
        id: biome
        run: |
          # Run Biome and save output to a file
          pnpm lint 2>&1 | tee biome-output.txt || true
          
          # Create reviewdog compatible format
          if [ -s biome-output.txt ]; then
            # Parse Biome output to reviewdog format
            sed -E 's/^(.*):([0-9]+):([0-9]+):[[:space:]]+(.*)[[:space:]]+\[(.*)\]$/\1:\2:\3:\5 \4/' biome-output.txt > reviewdog-input.txt
          fi
        continue-on-error: true
        
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
        
      - name: Run reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s reviewdog-input.txt ]; then
            cat reviewdog-input.txt | reviewdog -efm="%f:%l:%c:%m" -name="biome" -reporter="github-pr-review" -level="error"
          else
            echo "No Biome violations found."
          fi
      
      - name: Comment PR with Biome results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            let biomeOutput = '';
            try {
              biomeOutput = fs.readFileSync('biome-output.txt', 'utf8');
            } catch (error) {
              biomeOutput = 'No Biome output found.';
            }
            
            const comment = `
            ## 🧹 Biome Lint Results
            
            <details>
            <summary>Click to expand</summary>
            
            \`\`\`
            ${biomeOutput}
            \`\`\`
            
            </details>
            
            ${biomeOutput.includes('error') || biomeOutput.includes('warning') ? '⚠️ Please fix the issues above before merging.' : '✅ No linting issues found!'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });