name: reviewdog
on: [pull_request]

jobs:
  biome:
    name: runner / Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Install Biome
        run: npm install -g @biomejs/biome
      
      - name: Run Biome with reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      
      - name: Run reviewdog
        run: |
          # Check all files in current state
          biome check --reporter=rdjson . | reviewdog -f=rdjson -reporter=github-pr-review -filter-mode=nofilter -level=error
          # Also check changes from base branch
          git diff origin/${{ github.base_ref || 'main' }}..HEAD --name-only | xargs biome check --reporter=rdjson 2>/dev/null | reviewdog -f=rdjson -reporter=github-pr-review -filter-mode=diff -level=warning
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.github_token }}
    