name: Reviewdog

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  biome-lint:
    name: Biome Lint & Format (Reviewdog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for reviewdog to get the base branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install reviewdog
        uses: reviewdog/action-setup@v1

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.{js,jsx,ts,tsx,json}

      - name: Run Biome check with reviewdog
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a temporary file for biome output
          TEMP_FILE=$(mktemp)

          # Run Biome check and save to temporary file
          npx biome check --format=json \
            ${{ steps.changed-files.outputs.all_changed_files }} \
            > "$TEMP_FILE" 2>&1 || true

          # Process the output and send to reviewdog
          if [ -s "$TEMP_FILE" ]; then
            cat "$TEMP_FILE" | reviewdog -f=biome -name="biome" -reporter="github-pr-review" -level="error" -filter-mode="file"
          fi

          rm "$TEMP_FILE"

      - name: Check formatting with reviewdog
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a temporary file for format output
          TEMP_FILE=$(mktemp)

          # Run Biome format check and save to temporary file
          npx biome format --no-write --reporter=json \
            ${{ steps.changed-files.outputs.all_changed_files }} \
            > "$TEMP_FILE" 2>&1 || true

          # Process the output and send to reviewdog
          if [ -s "$TEMP_FILE" ]; then
            cat "$TEMP_FILE" | reviewdog -f=biome -name="biome-format" -reporter="github-pr-review" -level="warning" -filter-mode="file"
          fi

          rm "$TEMP_FILE"

  gritql-rules:
    name: GritQL Custom Rules (Reviewdog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for reviewdog to get the base branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install reviewdog and grit
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Install grit
        run: npm install -g @grithq/grit-cli

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.{js,jsx,ts,tsx}

      - name: Run GritQL rules with reviewdog
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a temporary file for GritQL issues report
          TEMP_FILE=$(mktemp)

          # Run each GritQL rule and collect results
          for rule in grit-rules/*.grit; do
            echo "Running GritQL rule: $(basename "$rule")"
            grit apply "$rule" ${{ steps.changed-files.outputs.all_changed_files }} --output json 2>/dev/null | \
            jq -r '.diagnostics[]? | {"source":"gritql","message":.message,"location":{"path":.file,"range":{"start":{"line":(.start.line+1),"column":(.start.column+1)}},"severity":"warning","code":"'$(basename "$rule" .grit)'"}' >> "$TEMP_FILE"
          done

          if [ -s "$TEMP_FILE" ]; then
            echo "GritQL issues found"
            cat "$TEMP_FILE" | reviewdog -f=rdjson -name="gritql" -reporter="github-pr-review" -level="warning" -filter-mode="file"
          else
            echo "No GritQL issues found"
          fi

          rm "$TEMP_FILE"